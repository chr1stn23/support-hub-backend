services:
  postgres:
    image: postgres:18-alpine
    container_name: supporthub-db
    environment:
      POSTGRES_DB: supporthub
      POSTGRES_USER: supporthub
      POSTGRES_PASSWORD: supporthub
    ports:
      - "5432:5432"
    volumes:
      - supporthub-pgdata:/var/lib/postgresql

volumes:
  supporthub-pgdata: