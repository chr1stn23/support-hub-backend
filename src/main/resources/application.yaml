spring:
  application:
    name: support-hub-backend
  profiles:
    active: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/supporthub}
    username: ${DATABASE_USERNAME:supporthub}
    password: ${DATABASE_PASSWORD:supporthub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:DyXOD3yLdP8ZWR5HeiyqML3FP9mok3Nwp28UEJHDzbU}
      expiration-minutes: 60
      issuer: supporthub
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}