spring:
  application:
    name: support-hub-backend
  profiles:
    active: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/supporthub}
    username: ${DATABASE_USERNAME:supporthub}
    password: ${DATABASE_PASSWORD:supporthub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: ${app.storage.max-file-size}
      max-request-size: 6MB

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:DyXOD3yLdP8ZWR5HeiyqML3FP9mok3Nwp28UEJHDzbU}
      expiration-minutes: 15
      issuer: supporthub
  session:
    cookie-secure: ${COOKIE_SECURE:true}
    same-site: Strict
    refresh-idle-days: 7
    refresh-absolute-days: 30
    expose-token-in-body: false # Solo local y test lo activan
    throttle:
      max-failures-per-email: 5
      max-failures-per-ip: 30
      window-minutes: 15
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    path: ${FILE_STORAGE_PATH:./storage/attachments}
    max-file-size: 5MB
    max-files-per-ticket: 10
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    persist-authorization: true