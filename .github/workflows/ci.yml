name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Permisos de gradlew
        run: chmod +x gradlew

      # check = pruebas unitarias + pruebas de integración (Testcontainers usa el Docker del runner)
      - name: Compilar y probar
        run: ./gradlew check --no-daemon

      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: build/reports/tests

  docker-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t supporthub-backend .