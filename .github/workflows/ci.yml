name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Permisos de gradlew
        run: chmod +x gradlew

      # check = pruebas unitarias + pruebas de integración (Testcontainers usa el Docker del runner)
      - name: Compilar y probar
        run: ./gradlew check --no-daemon

      - name: Informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t supporthub-backend .